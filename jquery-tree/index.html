<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>jQuery DragTree - 测试右侧拖拽</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="dragtree.css">
    <script src="jquery.dragtree.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f0f2f5;
        }
        .demo-container {
            display: flex;
            gap: 40px;
            padding: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .tree {
            width: 360px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 12px;
            background: #fafafa;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .tree h3 {
            margin-top: 0;
            text-align: center;
            font-size: 16px;
            color: #333;
        }
        .info {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #ddd;
            margin-top: 20px;
        }
        .log-panel {
            margin: 20px auto;
            width: 80%;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-panel h4 {
            margin: 0 0 8px 0;
            color: #ddd;
        }
        .log-entry {
            border-bottom: 1px solid #333;
            padding: 4px 0;
        }
        button {
            padding: 4px 12px;
            margin: 0 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="demo-container">
    <div class="tree" id="leftTree">
        <h3>📂 左侧树（可复制到右侧）</h3>
    </div>
    <div class="tree" id="rightTree">
        <h3>🎯 右侧树（内部可拖拽移动）</h3>
        <div style="text-align:center; margin-bottom:10px;">
            <button id="expandAll">全部展开</button>
            <button id="collapseAll">全部折叠</button>
            <button id="resetRight">重置右侧树</button>
        </div>
    </div>
</div>
<div class="log-panel" id="logPanel">
    <h4>📋 操作日志</h4>
    <div class="log-entry">初始化完成，开始拖拽测试...</div>
</div>
<div class="info">
    💡 <strong>测试步骤</strong><br>
    1. 从左侧拖拽节点到右侧 → 应该复制节点<br>
    2. 在右侧内部拖拽任意节点到另一个节点上/下/内部 → 应该移动位置<br>
    3. 右侧树拖拽时目标节点会有<strong>蓝色虚线边框</strong>高亮
</div>

<script>
    $(function() {
        // 日志记录
        function addLog(msg, type = 'info') {
            const colors = { info: '#8bc34a', copy: '#64b5f6', move: '#ffb74d', error: '#ef5350' };
            const logHtml = `<div class="log-entry" style="color: ${colors[type] || colors.info}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            $('#logPanel').append(logHtml);
            $('#logPanel').scrollTop($('#logPanel')[0].scrollHeight);
        }
        
        // 左侧树数据
        const leftTreeData = [
            {
                id: "L1",
                text: "前端框架",
                children: [
                    { id: "L1-1", text: "Vue.js", children: [] },
                    { id: "L1-2", text: "React", children: [] },
                    { id: "L1-3", text: "Angular", children: [] }
                ]
            },
            {
                id: "L2",
                text: "构建工具",
                children: [
                    { id: "L2-1", text: "Webpack", children: [] },
                    { id: "L2-2", text: "Vite", children: [] }
                ]
            },
            {
                id: "L3",
                text: "CSS方案",
                children: [
                    { id: "L3-1", text: "Tailwind", children: [] },
                    { id: "L3-2", text: "CSS Modules", children: [] }
                ]
            }
        ];
        
        // 右侧树数据（初始有一些节点）
        const rightTreeData = [
            {
                id: "R1",
                text: "我的收藏",
                children: [
                    { id: "R1-1", text: "jQuery 技巧", children: [] },
                    { id: "R1-2", text: "CSS Grid 布局", children: [] }
                ]
            },
            {
                id: "R2",
                text: "待学习清单",
                children: [
                    { id: "R2-1", text: "TypeScript", children: [] },
                    { 
                        id: "R2-2", 
                        text: "Node.js 进阶", 
                        children: [
                            { id: "R2-2-1", text: "Express", children: [] },
                            { id: "R2-2-2", text: "Nest.js", children: [] }
                        ]
                    }
                ]
            },
            {
                id: "R3",
                text: "已完成",
                children: []
            }
        ];
        
        // 初始化左侧树
        $('#leftTree').dragtree({
            data: leftTreeData,
            defaultCollapsed: true,
            enableLeftToRight: true,
            enableRightReorder: false,
            onCopy: function(source, cloned, target, position) {
                addLog(`📋 复制: "${source.text}" → 目标: "${target.text}" (位置: ${position})`, 'copy');
            },
            onDragStart: function(li, type) {
                addLog(`🚀 开始拖拽: "${$(li).find('.node-text').text()}"`, 'info');
            },
            onDragEnd: function(li, target, success) {
                if (!success) addLog(`❌ 拖拽取消`, 'error');
            }
        });
        
        // 初始化右侧树（重点测试内部拖拽）
        let currentRightData = JSON.parse(JSON.stringify(rightTreeData));
        
        function initRightTree() {
            $('#rightTree').dragtree({
                data: currentRightData,
                defaultCollapsed: true,
                enableLeftToRight: true,
                enableRightReorder: true,  // 开启内部拖拽重排
                onCopy: function(source, cloned, target, position) {
                    addLog(`📋 复制: "${source.text}" → 目标: "${target.text}" (位置: ${position})`, 'copy');
                    // 更新内部数据引用
                    currentRightData = $('#rightTree').data('dragtree-data');
                },
                onMove: function(node, target, position) {
                    addLog(`🔄 移动: "${node.text}" → 目标: "${target.text}" (位置: ${position})`, 'move');
                    // 移动后更新数据引用
                    currentRightData = $('#rightTree').data('dragtree-data');
                    console.log('移动后的右侧树数据:', currentRightData);
                },
                onDragStart: function(li, type) {
                    addLog(`🚀 开始拖拽: "${$(li).find('.node-text').text()}" (内部移动)`, 'info');
                },
                onDragEnd: function(li, target, success) {
                    if (success) {
                        addLog(`✅ 拖拽完成`, 'move');
                    } else {
                        addLog(`❌ 拖拽取消或无效`, 'error');
                    }
                },
                onToggle: function(node, state) {
                    addLog(`🔽 ${state === 'expanded' ? '展开' : '折叠'}: "${node.text}"`, 'info');
                },
                renderNode: function(node) {
                    const hasChildren = node.children && node.children.length > 0;
                    const icon = hasChildren ? '📁' : '📄';
                    return `${icon} <span class="node-text">${escapeHtml(node.text)}</span>`;
                }
            });
        }
        
        initRightTree();
        
        // 重置右侧树
        $('#resetRight').on('click', function() {
            currentRightData = JSON.parse(JSON.stringify(rightTreeData));
            initRightTree();
            addLog(`🔄 已重置右侧树`, 'info');
        });
        
        // 全部展开/折叠
        $('#expandAll').on('click', function() {
            $('#rightTree').find('li').each(function() {
                const $li = $(this);
                const $icon = $li.children('.node-wrapper').children('.toggle-icon');
                const hasChildren = $li.children('ul').length > 0;
                if (hasChildren && $li.hasClass('collapsed')) {
                    $li.removeClass('collapsed');
                    $icon.text('▼');
                }
            });
            addLog(`📂 全部展开`, 'info');
        });
        
        $('#collapseAll').on('click', function() {
            $('#rightTree').find('li').each(function() {
                const $li = $(this);
                const $icon = $li.children('.node-wrapper').children('.toggle-icon');
                const hasChildren = $li.children('ul').length > 0;
                if (hasChildren && !$li.hasClass('collapsed')) {
                    $li.addClass('collapsed');
                    $icon.text('▶');
                }
            });
            addLog(`📁 全部折叠`, 'info');
        });
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        addLog('✨ 初始化完成，请尝试拖拽右侧树内部节点！', 'info');
    });
</script>
</body>
</html>
